name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm test
      - name: Check JavaScript syntax
        run: |
          node --check server.js
          node --check middleware/uploadAuth.js
          node --check routes/chatRoutes.js
          node --check routes/uploadRoutes.js
          node --check services/chunking.js
          node --check services/embeddings.js
          node --check services/llm.js
          node --check services/pdfParser.js
          node --check services/pinecone.js
